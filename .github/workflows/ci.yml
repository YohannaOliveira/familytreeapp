name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      # Os testes de integracao usam Testcontainers (Docker ja vem no runner).
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: familytree, POSTGRES_USER: familytree, POSTGRES_PASSWORD: e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U familytree" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Subir o backend
        run: |
          export ADMIN_USER=admin
          export ADMIN_PASSWORD_HASH="$(docker run --rm httpd:2.4-alpine htpasswd -nbBC 10 '' "$E2E_PASSWORD" | tr -d ':\n' | sed 's/$2y/$2a/')"
          export JWT_SECRET=e2e-secret-e2e-secret-e2e-secret-0123456789
          export DB_PASSWORD=e2e PORT=8080 API_MAX_REQUESTS=100000
          export CORS_ALLOWED_ORIGINS=http://localhost:5174
          nohup java -jar backend/target/*-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
