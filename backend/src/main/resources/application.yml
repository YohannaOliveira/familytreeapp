spring:
  application:
    name: familytree
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familytree}
    username: ${DB_USER:familytree}
    password: ${DB_PASSWORD:familytree}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  # Use "native" atras de proxy confiavel (Render) para o rate limit ver o IP real do cliente.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
app:
  security:
    # Sem default: a aplicacao nao sobe sem estes segredos.
    admin-user: ${ADMIN_USER}
    admin-password-hash: ${ADMIN_PASSWORD_HASH}
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:30m}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window: ${LOGIN_WINDOW:1m}
    api-max-requests: ${API_MAX_REQUESTS:300}
    api-window: ${API_WINDOW:1m}
  photos:
    # Opcionais: sem eles o resto da aplicacao funciona e o upload de fotos responde 503.
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    upload-url-ttl: ${PHOTO_UPLOAD_URL_TTL:5m}
    max-bytes: ${PHOTO_MAX_BYTES:204800}
management:
  endpoints:
    web:
      exposure:
        include: health
